<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="まなびドラゴン">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="icon" href="images/icon-192.png">
<title>まなびドラゴン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"DotLocal";src:url("fonts/DotGothic16-Regular.ttf")}
:root{--gold:#ffd54a;--f:"DotLocal","DotGothic16","BIZ UDPGothic","Meiryo",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{position:fixed;inset:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{font-family:var(--f);color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:var(--f)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;background:#222 center/cover no-repeat}
.ol{color:#fff;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000}
.box{display:inline-block;color:#fff;text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,3px 3px #000,-3px -3px #000,3px -3px #000,-3px 3px #000,0 0 10px rgba(0,0,0,.6)}

/* 左サイド */
#side{position:absolute;left:0;top:0;bottom:0;width:220px;padding:14px 14px;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.25) 80%,transparent);z-index:5}
#phase{font-size:30px;line-height:1.2;margin-bottom:12px}
#face{width:130px;height:130px;position:relative;margin:4px 0 6px}
#face .art{width:130px;height:130px}
#face .emo{font-size:96px}
.gauge{position:relative;height:16px;border:3px solid #000;border-radius:3px;background:linear-gradient(90deg,#e11d48,#f97316 30%,#facc15 55%,#84cc16 75%,#22c55e);overflow:hidden}
.gauge::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(0,0,0,.35) 14px 16px)}
.gauge .mask{position:absolute;top:0;right:0;bottom:0;background:#1f1f1f;transition:width .45s}
.hpl{display:flex;align-items:center;gap:4px;font-size:15px}
.hpl b{color:#ef4444;font-size:18px}
#hpNum{font-size:20px;margin:2px 0 12px 18px}
#stats div{font-size:22px;line-height:1.45;display:flex;justify-content:space-between;width:170px}
#stats span:last-child{font-variant-numeric:tabular-nums}
#items{margin-top:12px;font-size:15px}
#items .it{font-size:14px;cursor:pointer;line-height:1.5;text-decoration:underline dotted}

/* 右上 */
#info{position:absolute;right:16px;top:14px;width:240px;text-align:center;z-index:5}
#dayN{font-size:52px}
#dow{font-size:60px;margin:2px 0 10px}
#next{font-size:24px;line-height:1.6}

/* 中央 */
#chara{position:absolute;left:300px;right:300px;top:40px;bottom:0;display:flex;align-items:flex-end;justify-content:center;z-index:1}
#chara .art{width:640px;height:640px}
#chara .art img{object-position:bottom}
#chara .emo{font-size:300px}
#bossHp{position:absolute;left:430px;width:420px;top:18px;z-index:6;display:none}
#bossHp .gauge{height:24px}
#bossHp .nm{font-size:22px;text-align:center}
#bossHp .num{font-size:16px;text-align:right;white-space:nowrap}
#bossHp .row2{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-top:3px}
#bStat{flex:1;display:flex;flex-wrap:wrap;gap:3px}
#bossHp .row2 .num{flex-shrink:0}
#bStat .chip{font-size:14px;padding:1px 6px;white-space:nowrap;}
#intent{position:absolute;right:14px;top:330px;width:250px;z-index:6;font-size:19px;line-height:1.4;padding:8px 12px;background:rgba(0,0,0,.72);border:3px solid var(--gold);border-radius:16px;text-align:center;display:none}
#intent.danger{border-color:#ef4444;color:#fecaca;animation:blink 1s infinite}
@keyframes blink{50%{box-shadow:0 0 22px #ef4444}}
#cdBox{position:absolute;right:60px;top:450px;z-index:6;text-align:center;display:none}
#cdBox .n{font-size:80px;line-height:1;color:#fff;text-shadow:0 0 14px #ef4444,3px 3px 0 #7f1d1d}
#cdBox .g{width:150px;height:12px;border:2px solid #000;background:#0008}
#cdBox .g i{display:block;height:100%;background:#38bdf8}

#choices{position:absolute;left:320px;width:640px;top:250px;height:290px;display:grid;gap:18px 22px;z-index:8}
#choices.c2{grid-template-columns:1fr 1fr}
#choices.c3{grid-template-columns:1fr 1fr 1fr}
.cbtn{background:#fff;color:#111;border:3px solid #111;border-radius:30px;box-shadow:0 9px 0 #f472b6,0 9px 0 3px #111;font-size:24px;cursor:pointer;padding:8px 14px;line-height:1.3;transition:transform .08s}
.cbtn:hover{transform:translateY(-2px)}
.cbtn:active{transform:translateY(6px);box-shadow:0 3px 0 #f472b6,0 3px 0 3px #111}
.cbtn.ok{background:#bbf7d0;box-shadow:0 9px 0 #16a34a,0 9px 0 3px #111}
.cbtn.ng{background:#fecaca;box-shadow:0 9px 0 #dc2626,0 9px 0 3px #111}
.cbtn.dim{opacity:.35}
.cbtn.hide{visibility:hidden}
.cbtn[disabled]{cursor:default}
.sbtn{border:3px solid #111;border-radius:22px;color:#fff;cursor:pointer;font-size:26px;line-height:1.25;box-shadow:0 8px 0 rgba(0,0,0,.5),0 8px 0 3px #111}
.sbtn:active{transform:translateY(5px)}
.sbtn small{display:block;font-size:17px}
.sbtn .tag{display:inline-block;font-size:15px;background:rgba(0,0,0,.4);padding:1px 8px;border-radius:8px;margin-top:3px}
.skcard{background:#fff;color:#111;border:3px solid #111;border-radius:22px;box-shadow:0 9px 0 #facc15,0 9px 0 3px #111;padding:14px;cursor:pointer;text-align:left;font-size:17px;line-height:1.5}
.skcard .skic{display:block;text-align:center;font-size:60px;line-height:1.1;margin-bottom:4px}
.skcard b{display:block;font-size:24px;color:#b45309;margin-bottom:6px}

#msgbar{position:absolute;left:170px;right:170px;bottom:30px;min-height:130px;background:rgba(56,140,150,.55);border-radius:70px;padding:22px 64px;z-index:7;font-size:26px;line-height:1.5;display:flex;flex-direction:column;justify-content:center}
#msgbar .sub{font-size:18px;opacity:.95}
#msgbar .ex{font-size:20px}
#msgbar .tap{position:absolute;right:48px;bottom:12px;font-size:18px;animation:b2 1s infinite}
@keyframes b2{50%{opacity:.2}}
#msgbar .timer{height:8px;background:var(--gold);border-radius:4px;margin-bottom:6px}
#halfBtn{position:absolute;right:190px;bottom:170px;z-index:9;font-size:18px;padding:6px 14px;border:3px solid #111;border-radius:16px;background:#fde68a;cursor:pointer;display:none}

/* 画面中央パネル（タイトル・結果） */
#panel{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#panel .in{background:rgba(20,16,40,.9);border:4px solid #fff;border-radius:18px;padding:22px 30px;width:880px;max-height:680px;overflow:auto}
#panel.title{background:transparent}
#panel.title .in{background:rgba(10,8,30,.55);border-color:rgba(255,255,255,.5);padding-top:6px}
#panel .logo{display:block;width:440px;margin:-6px auto 6px;filter:drop-shadow(0 0 18px rgba(0,0,0,.6))}
#panel h1{font-size:56px;text-align:center;color:var(--gold);margin-bottom:6px}
#panel h2{font-size:28px;text-align:center;margin:10px 0}
#panel p{font-size:19px;line-height:1.6}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{border:3px solid #111;border-radius:16px;padding:12px 26px;font-size:24px;background:#6d5dfc;color:#fff;cursor:pointer;box-shadow:0 6px 0 #111}
.btn.gold{background:#facc15;color:#111}
.btn.gray{background:#64748b}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.chip{font-size:16px;padding:2px 8px;border-radius:8px;color:#fff}
table{width:100%;font-size:20px;border-collapse:collapse}td{padding:3px}td:last-child{text-align:right}
.exl{background:#fff;color:#111;border-radius:10px;padding:8px 12px;margin:6px 0;font-size:17px}


/* リザルト：1画面レイアウト */
#panel .in.resmode{width:1220px;max-height:none;height:684px;overflow:hidden;padding:12px 20px}
.rgrid{display:grid;grid-template-columns:400px 1fr;gap:18px;height:100%}
.rleft{display:flex;flex-direction:column;align-items:center;text-align:center}
.rleft h1{font-size:42px !important;margin:0 !important}
.rsub{font-size:17px !important;margin:0 !important}
.rart{width:130px;height:130px;margin:2px 0}
.resmode .rscore{font-size:56px;line-height:1.1}
.resmode .rrank{font-size:64px;margin-top:6px}
.resmode .rrank::before{font-size:22px}
.resmode .rrow{font-size:17px;padding:2px 6px}
.rright{display:flex;flex-direction:column;min-height:0}
.rfade{opacity:0;transition:opacity .5s}
.rreview{flex:1;min-height:0;margin-top:6px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 10px;overflow:hidden}
.rrhead{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:2px}
.rpager{display:flex;align-items:center;gap:8px;font-size:15px}
.rpager button{border:2px solid #111;border-radius:8px;background:#fde68a;font-size:16px;padding:0 12px;cursor:pointer}
.resmode .exl{font-size:15px;padding:5px 10px;margin:5px 0;line-height:1.4}
.rexp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.resmode .rskip{position:absolute;bottom:8px;left:0;right:0}
.rnote{font-size:13px;opacity:.8;margin:6px 0 0}
.rbtns{display:flex;gap:12px;justify-content:center;margin-top:10px}
.rbtns .btn{font-size:20px;padding:10px 18px;white-space:nowrap}
/* リザルト演出 */
.rlist{margin:6px 0}
.rrow{display:flex;justify-content:space-between;font-size:20px;padding:3px 6px;border-bottom:1px solid #fff2;opacity:0}
.rrow b{color:#ffd54a;font-variant-numeric:tabular-nums}
.rrow.on{animation:slamIn .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes slamIn{0%{opacity:0;transform:scale(2.4);filter:brightness(3)}55%{opacity:1;transform:scale(.94);filter:brightness(1.6)}100%{opacity:1;transform:scale(1);filter:none}}
.rscore{font-size:68px;color:#ffd54a;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,213,74,.6)}
.rscore.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.18)}}
.rrank{display:inline-block;font-size:84px;line-height:1;padding:2px 26px;border:6px solid currentColor;border-radius:16px;opacity:0;transform:rotate(-8deg)}
.rrank::before{content:"RANK ";font-size:28px;vertical-align:middle}
.rrank.on{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) forwards;text-shadow:0 0 24px currentColor}
@keyframes stamp{0%{opacity:0;transform:scale(4) rotate(-25deg)}70%{opacity:1;transform:scale(.9) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
.rskip{text-align:center;font-size:14px;opacity:.6;margin-top:4px}
/* 暗転・アイテム選択 */
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4;transition:opacity .4s}
#dim.on{opacity:.8}
#choices.c4{grid-template-columns:repeat(4,1fr)}
.skcard.mini{padding:8px 6px;text-align:center;font-size:14px;position:relative}
.skcard.mini .skic{font-size:40px}
.skcard.mini b{font-size:16px;margin:2px 0 0}
.newtag{position:absolute;top:-8px;right:-6px;background:#ef4444;color:#fff;font-size:12px;padding:1px 6px;border-radius:8px;border:2px solid #111}
/* チュートリアル */
.tut{font-size:18px}
.tut p{font-size:17px;margin:4px 0;text-align:center}
.tsec{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:6px 14px;margin:6px 0}
.thead{font-size:21px;margin-bottom:6px;color:#ffd54a}
.tweek{display:flex;gap:6px;justify-content:center}
.tday{width:96px;background:#fff;color:#111;border:3px solid #111;border-radius:12px;text-align:center;padding:2px 0}
.tday .tw{font-size:22px;line-height:1.1}.tday .ti{font-size:20px;line-height:1.1}.tday .tl{font-size:14px}
.tday.sat .tw{color:#2a2ad0}.tday.sun{background:#ffe4e6}.tday.sun .tw{color:#dc2626}
.tboss{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.tboss div{background:#7f1d1d;border:3px solid #111;border-radius:10px;padding:2px 12px;text-align:center}
.tboss div b{display:block;font-size:20px}.tboss div span{font-size:14px}
.tboss .fin{background:#a16207}
.tboss i{font-style:normal;color:#ffd54a}
.tcycle{display:flex;align-items:center;justify-content:center;gap:8px}
.tnode{min-width:92px;border:3px solid #111;border-radius:40px;padding:4px 12px;text-align:center;font-size:24px;line-height:1.1}
.tnode small{display:block;font-size:13px}
.arr{font-size:26px;color:#ffd54a}
.tother{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px 10px;align-items:center;margin-top:8px;font-size:15px}
.tips div{font-size:16px;line-height:1.7}

/* 日付切り替え（ペルソナ風） */
#datecut{position:absolute;inset:0;z-index:40;display:none;background:#12161a;overflow:hidden}
#datecut::before,#datecut::after{content:"";position:absolute;left:0;right:0;height:60px;background:#2bbdef;z-index:2}
#datecut::before{top:0}#datecut::after{bottom:0}
#dcTitle{position:absolute;left:0;right:0;top:72px;text-align:center;font-size:52px;line-height:1.35;z-index:3}
#dcTitle .arrow{font-size:44px;display:block;line-height:1}
#strip{position:absolute;top:400px;left:0;height:200px;transition:transform .55s cubic-bezier(.2,.8,.2,1);z-index:3}
.dc{position:absolute;width:190px;text-align:center;font-family:var(--f);color:#9aa0a6}
.dc .d{font-size:64px;line-height:1;font-weight:900}
.dc .w{font-size:46px;font-weight:900;line-height:1.2}
.dc.sat{color:#2a2ad0}.dc.sun{color:#b01c2e}
.dc.now{color:#fff;transform:scale(1.25)}
.dc.now.sat{color:#6b7cff}.dc.now.sun{color:#ff4d6d}
.dc .bimg{position:absolute;left:35px;bottom:118px;width:120px;height:120px}
.dc .bimg .emo{font-size:86px}
.dc .bimg .art{width:100%;height:100%}
.dc .bn{position:absolute;left:-30px;right:-30px;top:120px;font-family:var(--f);font-size:22px;color:#fff}
.dc.final .d,.dc.final .w{color:#ffd54a}

/* 共通 */
.art{position:relative;display:flex;align-items:center;justify-content:center}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2}
.art .emo{line-height:1;visibility:hidden}
.art.noimg .emo{visibility:visible}
.aura{filter:drop-shadow(0 0 10px var(--aura,#fff))}
#toast{position:absolute;left:50%;top:20px;transform:translateX(-50%);background:var(--gold);color:#111;padding:10px 20px;border:3px solid #111;border-radius:12px;font-size:22px;z-index:50;display:none}
#modal{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:45}
.modalBox{background:#fff;color:#111;border:4px solid #111;border-radius:18px;padding:20px 26px;width:460px;text-align:center;font-size:20px}
.modalBox b{display:block;font-size:28px;color:#b45309;margin-bottom:8px}
.pop{animation:pp .3s}
@keyframes pp{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* エフェクト */
#fx{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.burst{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(.2);animation:burst .5s ease-out forwards}
@keyframes burst{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.slash{position:absolute;height:8px;border-radius:4px;animation:slash .35s ease-out forwards;box-shadow:0 0 14px currentColor}
@keyframes slash{0%{opacity:0;width:0}30%{opacity:1}100%{opacity:0;width:var(--w)}}
.pt{position:absolute;animation:fly .8s ease-out forwards;text-shadow:0 0 8px currentColor}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.dnum{position:absolute;transform:translate(-50%,-50%);-webkit-text-stroke:3px #000;paint-order:stroke;animation:dnum 1s ease-out forwards;white-space:nowrap}
@keyframes dnum{0%{transform:translate(-50%,-20%) scale(.5)}20%{transform:translate(-50%,-60%) scale(1.3)}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
.flash{position:absolute;inset:0;animation:flash .45s forwards}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.shake{animation:sh .4s}
.shakeBig{animation:sh2 .6s}
@keyframes sh{0%,100%{translate:0}20%{translate:-9px 2px}40%{translate:8px -3px}60%{translate:-6px 3px}80%{translate:4px -1px}}
@keyframes sh2{0%,100%{translate:0}15%{translate:-16px 6px}30%{translate:14px -7px}45%{translate:-11px 5px}60%{translate:9px -4px}80%{translate:-4px 2px}}
.hurt{animation:hurt .5s}
@keyframes hurt{0%,100%{filter:none}30%{filter:brightness(2) sepia(1) hue-rotate(-50deg) saturate(5)}}
.lunge{animation:lunge .35s}
@keyframes lunge{50%{scale:1.08;translate:0 20px}}
.guardFx{position:absolute;inset:6%;border:6px solid #7dd3fc;border-radius:50%;box-shadow:0 0 30px #7dd3fc inset,0 0 30px #7dd3fc;pointer-events:none;z-index:3;animation:pp .3s}

/* ---- アイテムのレアリティ ---- */
.rst{letter-spacing:0;white-space:pre}
#items .rst{display:inline-block;width:3.3em;text-align:right;text-decoration:none}
.rst.r1{color:#e5e7eb}.rst.r2{color:#60a5fa}.rst.r3{color:#fbbf24}
.rst.r4{animation:rbText 1.5s linear infinite}
@keyframes rbText{0%{color:#f43f5e}20%{color:#f59e0b}40%{color:#22c55e}60%{color:#3b82f6}80%{color:#a855f7}100%{color:#f43f5e}}
.rst{font-family:sans-serif}
.skcard .rst,.modalBox .rst{display:block;text-align:center;font-size:22px;line-height:1.1;margin-bottom:2px;text-shadow:0 0 1px #111}
.skcard .rst.r1,.modalBox .rst.r1{color:#9ca3af}
.skcard.rar1,.modalBox.rar1{border:5px solid #fff;box-shadow:0 0 0 3px #111,0 9px 0 3px #111}
.skcard.rar2,.modalBox.rar2{border:5px solid #3b82f6;box-shadow:0 0 0 3px #111,0 0 18px #3b82f6,0 9px 0 3px #1e3a8a}
.skcard.rar3,.modalBox.rar3{border:5px solid #f59e0b;box-shadow:0 0 0 3px #111,0 0 26px #fbbf24,0 9px 0 3px #92400e}
.skcard.rar4,.modalBox.rar4{border:6px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#f43f5e,#f59e0b,#eab308,#22c55e,#3b82f6,#a855f7,#f43f5e) 0 0/200% 100% border-box;box-shadow:0 0 0 3px #111,0 0 30px #c084fc;animation:pp .3s,rainbow 2s linear infinite}
@keyframes rainbow{to{background-position:0 0,200% 0}}
</style>
</head>
<body>
<div id="safe"></div>
<div id="stage">
  <div id="chara"></div>
  <div id="dim"></div>
  <div id="side">
    <div id="phase" class="ol"></div>
    <div id="face"></div>
    <div class="hpl"><b>♥</b><span class="ol">HP</span></div>
    <div class="gauge" id="pGauge"><div class="mask"></div></div>
    <div id="hpNum" class="ol"></div>
    <div class="ol" style="font-size:18px">学力ステータス</div>
    <div id="stats"></div>
    <div id="items"></div>
